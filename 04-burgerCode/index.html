<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Code - Sistema de Pedidos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="painel-pedido">
        <h2>Burger Code</h2>

        <!-- Visor do pedido atual -->
        <input type="text" id="visor-pedido" readonly placeholder="Seu pedido aparecerá aqui...">

        <!-- Botões de Produtos e Ações -->
        <div class="botoes">
            <!-- Linha 1: Produtos -->
            <button onclick="adicionarItem('Hambúrguer (R$ 15.00)')">Hambúrguer (R$ 15,00)</button>
            <button onclick="adicionarItem('Batata Frita (R$ 8.00)')">Batata Frita (R$ 8.00)</button>
            <button onclick="adicionarItem('Refrigerante (R$ 5.00)')">Refrigerante (R$ 5,00)</button>
            <button onclick="adicionarItem('Milk Shake (R$ 20.00)')">Milk Shake (R$ 20,00)</button>
            <button onclick="adicionarItem('Whisky(R$ 200.00)')">Whisky (R$ 200,00)</button> 
            <button onclick="adicionarItem('Porche (R$ 1.00)')">Porche 911 (R$ 1,00)</button>
            

            <!-- Linha 2: Ações -->
            <button onclick="calcularTotal()" class="btn-finalizar">Finalizar Pedido</button>
            <button onclick="limpar()"class="btn-limpar">Limpar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
